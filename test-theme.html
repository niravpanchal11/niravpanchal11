<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Theme CSS -->
    <link href="./css/theme.css" rel="stylesheet">
    <style>
        body {
            padding: 50px;
            min-height: 100vh;
        }
        .test-card {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Theme Toggle Test Page</h1>
        <p class="lead">This page tests the dark/light mode functionality.</p>
        
        <div class="card test-card">
            <div class="card-body">
                <h5 class="card-title">Test Card</h5>
                <p class="card-text">This card should change colors when you toggle the theme.</p>
                <button class="btn btn-danger">Test Button</button>
            </div>
        </div>
        
        <div class="alert alert-info">
            <strong>Instructions:</strong> Click the theme toggle button in the bottom-right corner to switch between light and dark modes.
        </div>
        
        <div class="card test-card">
            <div class="card-body">
                <h5 class="card-title">Current Theme</h5>
                <p id="theme-display">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Theme Toggle JS -->
    <script src="./js/theme-toggle.js"></script>
    
    <script>
        // Display current theme
        function updateThemeDisplay() {
            const theme = document.documentElement.getAttribute('data-theme') || 'light';
            document.getElementById('theme-display').textContent = 'Current theme: ' + theme.toUpperCase();
        }
        
        // Update on load
        setTimeout(updateThemeDisplay, 100);
        
        // Update when theme changes
        setInterval(updateThemeDisplay, 500);
    </script>
</body>
</html>
